# triggers.conf — ApiMorph automation triggers (Stage 8)
# All automation is OFF by default. Uncomment to enable.
# Manual scans (CLI / POST /api/v1/scans) always remain available.

# --- Manual (always available) ---
manual.enabled = true

# --- Cron / schedule ---
# schedule.enabled = false
# schedule.cron = 0 2 * * *
# schedule.timezone = UTC
# When schedule runs, create draft PRs for registered repos:
# schedule.create_pull_request = true

# --- Git push webhook ---
 webhook.enabled = true
# Comma-separated branch names or simple globs (suffix *).
# Examples:
#   main
#   main,master
#   main,release/*
 webhook.branches = main
# Optional path filters (comma-separated globs). Empty = all paths.
# webhook.path_filters =
# Reject payloads that fail X-Hub-Signature-256 when a secret is configured:
 webhook.require_signature = true

# --- Provider OpenAPI / SDK feed ---
# provider_feed.enabled = false
# provider_feed.providers = stripe
# provider_feed.interval = 6h
# provider_feed.create_pull_request = true
# Optional local fingerprint file (SHA256 of OpenAPI). If unset, uses bundled Stripe target fixture.
# provider_feed.stripe_openapi_path = /config/feeds/stripe_target.json
