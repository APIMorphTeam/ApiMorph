name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dotnet:
    name: .NET build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore ApiMorph.slnx

      - name: Build
        run: dotnet build ApiMorph.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ApiMorph.slnx --configuration Release --no-build --verbosity normal

  python:
    name: Python engine tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/engine
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose file
        run: docker compose -f deploy/docker-compose.yml config
