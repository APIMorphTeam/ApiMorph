name: Feature request
description: Suggest an idea or improvement
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: mvp-scope
    attributes:
      label: Is this in MVP scope (Stripe + C#)?
      options:
        - "Yes"
        - "No — post-MVP"
        - "Not sure"
    validations:
      required: true
